name: Envoi du site vers OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verifier les fichiers du site
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -d assets
          test -f .htaccess
          test -f robots.txt
          test -f sitemap.xml

      - name: Installer le logiciel de transfert
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Envoyer les fichiers vers OVH
        env:
          LFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          test -n "$LFTP_PASSWORD"
          lftp <<'LFTP'
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 2
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=accept-new"
          open --env-password -u alexawb sftp://ftp.cluster129.hosting.ovh.net:22
          mirror --reverse --verbose --parallel=1 --no-perms --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitattributes --exclude-glob README* . /home/alexawb/www
          # Supprimer uniquement la copie publique des workflows sur OVH.
          rm -rf /home/alexawb/www/.github
          bye
          LFTP
